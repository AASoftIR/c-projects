name: Weekly reference health
on:
  schedule:
    - cron: '0 6 * * 5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 scripts/course.py test all --mode reference --cc clang
      - run: python3 scripts/course.py test all --mode reference --cc clang --sanitize
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reference-health
          path: build/logs/reference/
